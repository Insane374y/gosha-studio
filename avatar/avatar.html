<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1080"></canvas>
<script src="doodle.js"></script>
<script>
const FOBBIN = { body: "#f5c518", stripe: "#1f3a6e", hair: "curly", hairColor: "#a0522d", glasses: "#d6334a", backpack: "#3aa676", shoes: "#2f6fd6", plaster: true };
const c = document.getElementById("c"), g = c.getContext("2d");
// фон: бирюзовый круг с лучами
const bg = g.createRadialGradient(540, 520, 60, 540, 540, 760); bg.addColorStop(0, "#5fd3c6"); bg.addColorStop(1, "#1f8a8f");
g.fillStyle = bg; g.fillRect(0, 0, 1080, 1080);
g.save(); g.translate(540, 470); g.fillStyle = "rgba(255,255,255,0.10)";
for (let i = 0; i < 16; i++) { g.rotate(Math.PI / 8); g.beginPath(); g.moveTo(0, 0); g.lineTo(-90, -900); g.lineTo(90, -900); g.closePath(); g.fill(); }
g.restore();
// знаки «?» на фоне
g.font = '900 210px "Inter Display", Inter, sans-serif'; g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round";
for (const [x, y, r, col] of [[175, 250, -0.35, "#f5c518"], [905, 300, 0.3, "#ffffff"]]) { g.save(); g.translate(x, y); g.rotate(r); g.lineWidth = 22; g.strokeStyle = "#20180f"; g.strokeText("?", 0, 0); g.fillStyle = col; g.fillText("?", 0, 0); g.restore(); }
// Гоша: крупно голова и плечи
const cv = document.createElement("canvas"); cv.width = CW; cv.height = CH;
drawDoodle(cv.getContext("2d"), FOBBIN, { expr: "grin", lookX: 0, tilt: -0.06, flyEyes: 0,
 });
// голова в плоскости: центр на высоте 0.97 м, плоскость 1.4×2.1 м → 560×840 пикселей (400 px/м)
const s = 2.05; // масштаб
const headX = CW / 2, headY = CH - 0.97 * 400;
g.drawImage(cv, 540 - headX * s, 560 - headY * s, CW * s, CH * s);
// муха на кудрях
function fly(x, y, k) { g.save(); g.translate(x, y); g.rotate(0.35);
  g.globalAlpha = 0.6; g.fillStyle = "#e6f6ff"; g.strokeStyle = "#20180f"; g.lineWidth = 5;
  for (const sx of [-1, 1]) { g.save(); g.rotate(sx * 0.9); g.beginPath(); g.ellipse(sx * k * 0.6, -k * 0.9, k * 0.45, k * 1.05, sx * 0.4, 0, 7); g.fill(); g.stroke(); g.restore(); }
  g.globalAlpha = 1; g.fillStyle = "#2b2e35"; g.beginPath(); g.ellipse(0, k * 0.25, k * 0.55, k * 0.85, 0, 0, 7); g.fill(); g.stroke();
  g.beginPath(); g.arc(0, -k * 0.7, k * 0.45, 0, 7); g.fill(); g.stroke();
  for (const sx of [-1, 1]) { g.fillStyle = "#c62c34"; g.beginPath(); g.ellipse(sx * k * 0.38, -k * 0.85, k * 0.34, k * 0.4, sx * 0.3, 0, 7); g.fill(); g.stroke();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(sx * k * 0.3, -k * 1.0, k * 0.09, 0, 7); g.fill(); }
  g.restore(); }
fly(770, 205, 44);
document.title = "done";
</script></body></html>
